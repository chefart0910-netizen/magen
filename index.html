<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGEN - בריאות האתר שלך</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap"
    />
    <!-- שפה וכיוון לפני טעינת ריאקט, כדי שמבקר ב-/en לא יראה הבהוב של פריסה מימין
         לשמאל. inline ולא קובץ חיצוני כדי לא להוסיף בקשה חוסמת לפני הציור הראשון;
         ה-CSP ב-vercel.json מתיר אותו לפי sha256 של התוכן המדויק - לא unsafe-inline.
         שינוי של תו אחד כאן מחייב עדכון ה-hash, אחרת הדפדפן חוסם את הסקריפט בשקט. -->
    <script>(function(){var p=location.pathname;if(p==="/en"||p.indexOf("/en/")===0){document.documentElement.lang="en";document.documentElement.dir="ltr";}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
