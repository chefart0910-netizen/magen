name: MAGEN scan

# מופעל אך ורק ע"י MAGEN דרך ה-API (workflow_dispatch), לא בדחיפת קוד.
on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: מזהה הסריקה במסד הנתונים
        required: true
      url:
        description: כתובת האתר לבדיקה
        required: true

# הרצה אחת לכל סריקה; אין טעם שתריץ פעמיים את אותו scan_id.
concurrency:
  group: magen-scan-${{ inputs.scan_id }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # בלי cache: npm - הוא נכשל כשאין package-lock.json. כשיתווסף lock file אפשר
      # להחזיר אותו וההתקנה תתקצר משמעותית.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # npm ci דורש lock file וקורס בלעדיו. עובדים עם מה שיש בריפו בפועל.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev --no-audit --no-fund
          fi

      - name: Run scan
        env:
          # כתובת האתר מגיעה ממשתמש. היא מועברת כמשתנה סביבה בלבד ולעולם לא מוטמעת
          # ישירות בתוך שורת הפקודה - הטמעה של ${{ ... }} בתוך run היא הזרקת פקודות.
          SCAN_URL: ${{ inputs.url }}
          SCAN_ID: ${{ inputs.scan_id }}
          SCAN_RUNNER: local
          CHROME_PATH: /usr/bin/google-chrome
          # אין תקרת 60 שניות כאן, אבל תקציב שפוי מונע ריצה תקועה.
          LIGHTHOUSE_BUDGET_MS: "300000"
          AXE_BUDGET_MS: "120000"
          SCAN_TOTAL_BUDGET_MS: "480000"
          CALLBACK_URL: ${{ secrets.MAGEN_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.MAGEN_CALLBACK_SECRET }}
        run: node scripts/run-scan.js

      # רשת ביטחון: אם משהו נפל לפני run-scan.js (התקנה, checkout), אף אחד לא היה מדווח
      # ל-MAGEN והסריקה הייתה נשארת "רצה" לנצח. השלב הזה סוגר אותה במפורש.
      - name: Report failure
        if: failure()
        env:
          SCAN_ID: ${{ inputs.scan_id }}
          CALLBACK_URL: ${{ secrets.MAGEN_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.MAGEN_CALLBACK_SECRET }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-magen-scan-secret: $CALLBACK_SECRET" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"error\":\"the GitHub Actions run failed before the scan completed\"}" || true
