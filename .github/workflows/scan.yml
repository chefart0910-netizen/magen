name: MAGEN scan

# מופעל אך ורק ע"י MAGEN דרך ה-API (workflow_dispatch), לא בדחיפת קוד.
on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: מזהה הסריקה במסד הנתונים
        required: true
      url:
        description: כתובת האתר לבדיקה
        required: true

# הרצה אחת לכל סריקה; אין טעם שתריץ פעמיים את אותו scan_id.
concurrency:
  group: magen-scan-${{ inputs.scan_id }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # מטמון על ~/.npm במקום cache: npm של setup-node - זה לא דורש package-lock.json
      # ובכל זאת חוסך את רוב זמן ההורדה. המפתח הוא ה-hash של package.json, כך שהמטמון
      # מתאפס אוטומטית כשמשנים תלויות.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-

      - name: Install dependencies
        # npm install ולא npm ci: ל-npm ci נדרש lock file שנוצר בדיוק בסביבה הזו, וכל
        # פער בפתרון הגרסאות מפיל אותו. עדיף התקנה שתמיד עובדת על פני נעילה שנשברת.
        run: npm install --omit=dev --no-audit --no-fund

      # נכשל מוקדם ובקול אם ה-secrets לא הוגדרו, במקום לגלות את זה רק כשהתוצאה לא חוזרת.
      - name: Verify callback configuration
        env:
          CALLBACK_URL: ${{ secrets.MAGEN_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.MAGEN_CALLBACK_SECRET }}
        run: |
          missing=""
          [ -z "$CALLBACK_URL" ] && missing="$missing MAGEN_CALLBACK_URL"
          [ -z "$CALLBACK_SECRET" ] && missing="$missing MAGEN_CALLBACK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing - add them under Settings > Secrets and variables > Actions"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-magen-scan-secret: $CALLBACK_SECRET" \
            -d '{"scan_id":"__preflight__"}' || echo "000")
          # 404 = הסוד נכון והשרת חיפש סריקה בשם __preflight__ ולא מצא. זה מה שאנחנו רוצים.
          case "$code" in
            404) echo "callback reachable and the secret matches" ;;
            401) echo "::error::MAGEN_CALLBACK_SECRET does not match SCAN_CALLBACK_SECRET in Vercel"; exit 1 ;;
            000) echo "::error::could not reach $CALLBACK_URL - check MAGEN_CALLBACK_URL"; exit 1 ;;
            *)   echo "::error::unexpected response $code from the callback"; exit 1 ;;
          esac

      - name: Run scan
        env:
          # כתובת האתר מגיעה ממשתמש. היא מועברת כמשתנה סביבה בלבד ולעולם לא מוטמעת
          # ישירות בתוך שורת הפקודה - הטמעה של ${{ ... }} בתוך run היא הזרקת פקודות.
          SCAN_URL: ${{ inputs.url }}
          SCAN_ID: ${{ inputs.scan_id }}
          SCAN_RUNNER: local
          CHROME_PATH: /usr/bin/google-chrome
          LIGHTHOUSE_BUDGET_MS: "300000"
          AXE_BUDGET_MS: "120000"
          SCAN_TOTAL_BUDGET_MS: "480000"
          CALLBACK_URL: ${{ secrets.MAGEN_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.MAGEN_CALLBACK_SECRET }}
        run: node scripts/run-scan.js

      # always() ולא failure(): ביטול (למשל timeout של ה-job) אינו נחשב failure, ובלי זה
      # סריקה שנחתכה בזמן הייתה נשארת "רצה". השלב עצמו לא ידווח אם הסריקה הצליחה כבר.
      - name: Report failure
        if: always() && job.status != 'success'
        env:
          SCAN_ID: ${{ inputs.scan_id }}
          CALLBACK_URL: ${{ secrets.MAGEN_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.MAGEN_CALLBACK_SECRET }}
        run: |
          # בלי || true: אם גם הדיווח על הכישלון נכשל, זה חייב להופיע בלוג. הבליעה הזו
          # היא בדיוק מה שהסתיר שה-secrets חסרים.
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-magen-scan-secret: $CALLBACK_SECRET" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"error\":\"the GitHub Actions run did not complete the scan\"}" || echo "000")
          echo "failure report returned HTTP $code"
          [ "$code" = "200" ] || echo "::warning::the failure report did not reach MAGEN (HTTP $code)"
